<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>雾港档案馆 · RP 设定集</title>
  <style>
    :root{--ink:#1b232b;--muted:#66717b;--paper:#f5f1e9;--cream:#fffdf8;--navy:#172a38;--sea:#3f7270;--gold:#b8864c;--line:#ddd5c8;--red:#a84f45}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","SimSun",serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.26;background-image:radial-gradient(#9d927d .55px,transparent .65px);background-size:5px 5px;mix-blend-mode:multiply}
    .shell{max-width:1360px;margin:auto;padding:24px 32px 55px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:19px}
    .mark{display:flex;align-items:center;gap:13px;color:var(--navy);letter-spacing:.06em}.seal{width:43px;height:43px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:23px}.mark small{display:block;font-size:10px;letter-spacing:.23em;color:var(--gold);margin-bottom:1px}.mark strong{font-size:17px}
    .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:#6eaa86;border-radius:50%}
    .hero{padding:58px 0 39px;display:grid;grid-template-columns:1.3fr .7fr;gap:60px;align-items:end}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.19em}.hero h1{font-family:"Songti SC","STSong","SimSun",serif;font-size:clamp(42px,7vw,82px);line-height:1.06;letter-spacing:.02em;margin:14px 0 16px;color:var(--navy)}.hero p{max-width:590px;color:var(--muted);line-height:1.95;font-size:15px}
    .quote{border-left:1px solid var(--gold);padding:7px 0 7px 22px;color:var(--sea);font-size:15px;line-height:1.85;font-style:italic}.quote span{display:block;color:var(--muted);font-size:11px;font-style:normal;margin-top:8px;letter-spacing:.12em}
    nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto}.tab{appearance:none;border:0;background:transparent;padding:15px 18px 14px;color:var(--muted);font-family:inherit;font-size:13px;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--navy);border-color:var(--gold);font-weight:bold}
    .toolbar{display:flex;justify-content:space-between;gap:15px;margin:28px 0 21px;align-items:center}.search{width:min(390px,100%);background:var(--cream);border:1px solid var(--line);padding:12px 15px;font:13px inherit;color:var(--ink);outline-color:var(--gold)}.tool-right{display:flex;gap:10px}.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;font:12px inherit;padding:11px 16px;cursor:pointer;letter-spacing:.04em}.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:17px}.card{background:var(--cream);border:1px solid var(--line);padding:23px;position:relative;min-height:185px;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #172a3812;border-color:#bba982}.card.wide{grid-column:span 7}.card.medium{grid-column:span 5}.card.third{grid-column:span 4}.card h2{font-size:20px;color:var(--navy);margin:10px 0 10px}.card p{font-size:13px;line-height:1.85;color:var(--muted);margin:0}.tag{font-family:Arial,sans-serif;color:var(--gold);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.num{position:absolute;right:19px;top:18px;color:#d9d1c3;font:600 27px Georgia,serif}.card .foot{position:absolute;bottom:20px;left:23px;font-size:11px;color:var(--sea)}
    .timeline{display:flex;gap:0;overflow:auto;padding:7px 0 3px}.era{min-width:180px;border-top:1px solid var(--gold);padding:13px 19px 15px 0;margin-right:20px}.era b{display:block;font-size:14px;color:var(--navy);margin-bottom:6px}.era span{font-size:11px;color:var(--muted);line-height:1.6}.hidden{display:none!important}.empty{grid-column:1/-1;padding:65px;text-align:center;color:var(--muted);background:var(--cream);border:1px dashed var(--line)}
    .modal{position:fixed;inset:0;background:#15212a80;z-index:5;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.sheet{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:var(--cream);padding:32px;border:1px solid var(--gold);box-shadow:0 20px 80px #0004}.close{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}.sheet h2{font-size:29px;color:var(--navy);margin:8px 0 15px}.sheet p{line-height:2;color:var(--muted);font-size:14px}.form label{display:block;margin-top:16px;font-size:12px;color:var(--muted)}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);background:#fffdf8;padding:10px;margin-top:6px;font:14px inherit}.form textarea{height:110px;resize:vertical}.form-actions{display:flex;justify-content:end;gap:9px;margin-top:22px}
    footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.08em}
    @media(max-width:720px){.shell{padding:18px}.hero{grid-template-columns:1fr;gap:24px;padding:42px 0 28px}.card.wide,.card.medium,.card.third{grid-column:span 12}.toolbar{align-items:stretch;flex-direction:column}.tool-right{justify-content:end}.hero h1{font-size:48px}.top .status{display:none}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="mark"><div class="seal">✦</div><div><small>THE MISTHARBOR ARCHIVES</small><strong>雾港档案馆</strong></div></div><div class="status"><i class="dot"></i>设定集 · 持续记录中</div></header>
  <section class="hero"><div><div class="eyebrow">ROLEPLAY WORLD BIBLE · VOLUME I</div><h1>潮雾笼罩的<br>海上王国</h1><p>一册用于记录角色、地理、势力与历史的世界观资料库。每一条设定都像潮水退去后留下的印记，等待被写进下一场故事。</p></div><blockquote class="quote">“港口从不问来客的过去，只记得每一艘离岸的船。”<span>—《雾港航海志》卷首</span></blockquote></section>
  <nav><button class="tab active" data-view="all">总览</button><button class="tab" data-view="world">世界观</button><button class="tab" data-view="character">人物</button><button class="tab" data-view="place">地点</button><button class="tab" data-view="faction">势力</button><button class="tab" data-view="timeline">时间线</button></nav>
  <div class="toolbar"><input id="search" class="search" placeholder="搜索设定、人物或地点…" /><div class="tool-right"><button class="btn ghost" id="reset">恢复示例</button><button class="btn" id="add">＋ 新建档案</button></div></div>
  <section id="cards" class="grid"></section>
  <section id="timeline" class="timeline hidden"></section>
  <footer><span>雾港档案馆 · 私人 RP 设定集</span><span>点击卡片查看 / 编辑</span></footer>
</main>
<div class="modal" id="modal"><article class="sheet" id="sheet"></article></div>
<script>
const seed=[
 {id:'world',type:'world',title:'潮汐与月',tag:'世界法则',text:'世界由双月牵引。银月掌管海潮与记忆，赤月每隔九年升起一次，届时所有航海罗盘都会失灵。',size:'wide'},
 {id:'char1',type:'character',title:'伊芙琳·罗',tag:'人物档案',text:'雾港最年轻的引航员。她能在浓雾中听见船只的名字，却始终听不见自己父亲失踪那晚的钟声。',size:'medium'},
 {id:'place1',type:'place',title:'第七灯塔',tag:'地点图志',text:'建在礁石尽头的废弃灯塔。传闻塔顶的蓝火会为迷途者指出一条归途，也会夺走一段最珍贵的记忆。',size:'third'},
 {id:'faction1',type:'faction',title:'盐鸦议会',tag:'势力组织',text:'由七个旧商会组成的港城统治者。其成员从不公开露面，谈判时只留下沾着海盐的黑色羽毛。',size:'third'},
 {id:'place2',type:'place',title:'沉钟市场',tag:'地点图志',text:'只在退潮后的两个时辰出现。这里可以买到被遗忘的梦、禁航海图，以及不该属于活人的情书。',size:'third'},
 {id:'char2',type:'character',title:'阿尔德·维恩',tag:'人物档案',text:'失去爵位的前海军上校，如今经营一家没有招牌的酒馆。他的左手戴着从不取下的旧式潜水手套。',size:'wide'}
];
const eras=[['雾历 0 年','双月第一次交汇，海平面下降，雾港的地基从海底显现。'],['雾历 183 年','七家商会签订盐约，盐鸦议会成立。'],['雾历 417 年','第七灯塔熄灭。最后一位守灯人失踪。'],['雾历 648 年','赤月将临，失踪船只开始回到港口。']];
let items=JSON.parse(localStorage.getItem('mistHarbor')||'null')||seed, view='all', editing=null;
const labels={world:'世界观',character:'人物',place:'地点',faction:'势力'};
function save(){localStorage.setItem('mistHarbor',JSON.stringify(items))}
function render(){const q=document.querySelector('#search').value.trim().toLowerCase();let arr=items.filter(x=>(view==='all'||x.type===view)&&(x.title+x.tag+x.text).toLowerCase().includes(q));document.querySelector('#cards').classList.toggle('hidden',view==='timeline');document.querySelector('#timeline').classList.toggle('hidden',view!=='timeline');if(view==='timeline'){document.querySelector('#timeline').innerHTML=eras.map((e,i)=>`<div class="era"><b>${String(i+1).padStart(2,'0')} · ${e[0]}</b><span>${e[1]}</span></div>`).join('');return}document.querySelector('#cards').innerHTML=arr.length?arr.map((x,i)=>`<article class="card ${x.size||'third'}" data-id="${x.id}"><span class="tag">${x.tag}</span><span class="num">0${i+1}</span><h2>${x.title}</h2><p>${x.text}</p><span class="foot">查看档案 →</span></article>`).join(''):'<div class="empty">没有找到相符的档案。</div>'}
function modal(item){editing=item;const isNew=!item;document.querySelector('#sheet').innerHTML=`<button class="close" aria-label="关闭">×</button><h2>${isNew?'新建档案':item.title}</h2>${isNew?`<form class="form"><label>档案名称<input name="title" required placeholder="例如：白鲸号"></label><label>分类<select name="type"><option value="character">人物</option><option value="place">地点</option><option value="faction">势力</option><option value="world">世界观</option></select></label><label>设定内容<textarea name="text" required placeholder="记录这条设定…"></textarea></label><div class="form-actions"><button type="button" class="btn ghost close2">取消</button><button class="btn">保存档案</button></div></form>`:`<p><span class="tag">${item.tag}</span></p><p>${item.text}</p><div class="form-actions"><button class="btn ghost delete">删除</button><button class="btn edit">编辑此档案</button></div>`}`;document.querySelector('#modal').classList.add('show')}
document.querySelector('nav').onclick=e=>{if(!e.target.matches('.tab'))return;document.querySelector('.tab.active').classList.remove('active');e.target.classList.add('active');view=e.target.dataset.view;render()};
document.querySelector('#search').oninput=render;document.querySelector('#cards').onclick=e=>{const c=e.target.closest('[data-id]');if(c)modal(items.find(x=>x.id===c.dataset.id))};document.querySelector('#add').onclick=()=>modal(null);document.querySelector('#reset').onclick=()=>{items=seed.map(x=>({...x}));save();render()};
document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal'||e.target.closest('.close')||e.target.closest('.close2'))document.querySelector('#modal').classList.remove('show');if(e.target.closest('.delete')){items=items.filter(x=>x.id!==editing.id);save();render();document.querySelector('#modal').classList.remove('show')}if(e.target.closest('.edit')){const x=editing;document.querySelector('#sheet').innerHTML=`<button class="close">×</button><h2>编辑档案</h2><form class="form"><label>档案名称<input name="title" required value="${x.title}"></label><label>分类<select name="type">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${x.type===k?'selected':''}>${v}</option>`).join('')}</select></label><label>设定内容<textarea name="text" required>${x.text}</textarea></label><div class="form-actions"><button class="btn">保存修改</button></div></form>`}};
document.querySelector('#modal').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(editing){Object.assign(editing,d,{tag:labels[d.type]+'档案'})}else{items.unshift({id:Date.now().toString(),...d,tag:labels[d.type]+'档案',size:'third'})}save();render();document.querySelector('#modal').classList.remove('show')};render();
</script>
</body></html>
